name: Frontend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check public/app.js && node --check public/components/workspace.js && node --check server.mjs
      - run: npm run test:frontend
      - run: npm run test:ui
      - run: npm run build:storybook
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: test-results/
